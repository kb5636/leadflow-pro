<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>LeadFlow Pro Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-5">
    <h1 class="mb-4">📊 LeadFlow Pro Dashboard</h1>

    <form class="mb-5" method="post" action="/add-lead">
      <div class="row g-3">
        <div class="col-md-4">
          <input type="text" class="form-control" name="name" placeholder="Lead Name" required>
        </div>
        <div class="col-md-4">
          <input type="email" class="form-control" name="email" placeholder="Email">
        </div>
        <div class="col-md-4">
          <input type="text" class="form-control" name="phone" placeholder="Phone Number">
        </div>
      </div>
      <div class="mt-3">
        <button type="submit" class="btn btn-primary">➕ Add Lead</button>
      </div>
    </form>

    <h3>📋 All Leads</h3>
    <table class="table table-striped">
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Phone</th>
        </tr>
      </thead>
      <tbody>
        {% for lead in leads %}
        <tr>
          <td>{{ lead[0] }}</td>
          <td>{{ lead[1] }}</td>
          <td>{{ lead[2] }}</td>
          <td>{{ lead[3] }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</body>
</html>
<td>
  <form action="/delete-lead/{{ lead[0] }}" method="post" onsubmit="return confirm('Are you sure you want to delete this lead?');">
    <button type="submit" class="btn btn-danger btn-sm">🗑 Delete</button>
  </form>
</td>
